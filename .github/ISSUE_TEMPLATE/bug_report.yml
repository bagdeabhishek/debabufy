name: Bug report
description: Report a reproducible problem using synthetic data only.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach a real statement, HAR, PAN, contact detail, address,
        payment reference, credential, OTP, or unredacted portal screenshot.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem without personal or filing data.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic inputs and field paths only.
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Chrome 000 or Firefox 000"
    validations:
      required: true

  - type: input
    id: extension_version
    attributes:
      label: Extension version
      description: Provide the version, commit, or CI artifact name.
      placeholder: "0.1.0, commit abc1234, or tds-26qb-assistant-main-*"
    validations:
      required: true

  - type: dropdown
    id: synthetic_test
    attributes:
      label: Synthetic dry run
      description: Did examples/synthetic-statement.json work as documented?
      options:
        - "Yes"
        - "No"
        - "Not attempted"
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed all real taxpayer, property, filing, and payment data.
          required: true
