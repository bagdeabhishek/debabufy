name: Bug report
description: Report a reproducible problem using synthetic data only.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach a real statement, HAR, diagnostic file, browser profile,
        PAN, contact detail, address, payment reference, credential, OTP, or
        unredacted portal screenshot.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem without personal or filing data.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic inputs and field paths only.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "DeBabufy 0.1.0, Windows 11, Chrome 000"
    validations:
      required: true

  - type: input
    id: workflow_version
    attributes:
      label: Workflow and version
      description: Provide the workflow, version, commit, or CI artifact name.
      placeholder: "Form 141 1.0.0, commit abc1234, or main-build-42"
    validations:
      required: true

  - type: dropdown
    id: synthetic_test
    attributes:
      label: Synthetic dry run
      description: Did the workflow's synthetic fixture work?
      options:
        - "Yes"
        - "No"
        - "Not attempted"
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed all real taxpayer, property, filing, and payment data.
          required: true
