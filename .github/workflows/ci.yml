name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev

  windows:
    name: Build Windows installer
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run dist:win

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -Filter *.exe
          if ($files.Count -eq 0) { throw "No Windows installer was built." }
          foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)" | Out-File -Append -Encoding ascii dist/SHA256SUMS.txt
          }

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v7
        with:
          name: debabufy-windows-main-${{ github.run_number }}-${{ github.sha }}
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish main prerelease
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: debabufy-windows-main-${{ github.run_number }}-${{ github.sha }}
          path: release-assets

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="main-build-${GITHUB_RUN_NUMBER}"
          gh release create "${tag}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "DeBabufy main build #${GITHUB_RUN_NUMBER}" \
            --notes "Automated unsigned Windows alpha build for main commit ${GITHUB_SHA}. Verify SHA256SUMS.txt before running." \
            --prerelease
